# ==========================================
# Render Infrastructure Blueprint for Vinylflix
# Deploy at once: Web Service + Managed PostgreSQL
# ==========================================

databases:
  - name: vinylflix-db
    databaseName: vinylflix
    user: vinylflix_user
    plan: free # or starter / standard
    region: frankfurt # or oregon / ohio / singapore

services:
  - type: web
    name: vinylflix
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: frankfurt # Match database region for minimal latency
    plan: free # or starter
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_NAME
        value: Vinylflix
      - key: DATABASE_URL
        fromDatabase:
          name: vinylflix-db
          property: connectionString
      - key: AUTO_SEED
        value: "true" # Automatically seeds super admin & standard plans on initial boot
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: PAYMENT_PROVIDER
        value: PAYSTACK
      - key: PAYSTACK_SECRET_KEY
        sync: false # Set in Render Dashboard
      - key: PAYSTACK_PUBLIC_KEY
        sync: false # Set in Render Dashboard
      - key: PAYMENT_WEBHOOK_SECRET
        sync: false # Set in Render Dashboard
      - key: YOUTUBE_CLIENT_ID
        sync: false # Set in Render Dashboard
      - key: YOUTUBE_CLIENT_SECRET
        sync: false # Set in Render Dashboard
      - key: YOUTUBE_API_KEY
        sync: false # Set in Render Dashboard
      - key: YOUTUBE_REDIRECT_URI
        sync: false # Set in Render Dashboard (e.g. https://vinylflix.onrender.com/api/v1/youtube/oauth/callback)
